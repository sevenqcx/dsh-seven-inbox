<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Seven Inbox">
  <defs>
    <linearGradient id="s7i-bg" x1="18" y1="10" x2="162" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="s7i-well" x1="90" y1="30" x2="90" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1f5c" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0b153f" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="s7i-card" x1="44" y1="42" x2="136" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="s7i-tray" x1="90" y1="92" x2="90" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="s7i-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#s7i-bg)"/>
  <rect x="1.25" y="1.25" width="177.5" height="177.5" rx="38.75" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5"/>
  <rect x="28" y="30" width="124" height="120" rx="26" fill="url(#s7i-well)"/>
  <!-- Elevated active/working card -->
  <rect x="40" y="42" width="100" height="44" rx="13" fill="url(#s7i-card)"/>
  <circle cx="58" cy="64" r="11" fill="url(#s7i-glow)"/>
  <circle cx="58" cy="64" r="5.5" fill="#2563eb"/>
  <rect x="72" y="54.5" width="52" height="7.5" rx="3.75" fill="#1e3a8a" fill-opacity="0.82"/>
  <rect x="72" y="67" width="34" height="6" rx="3" fill="#3b82f6" fill-opacity="0.38"/>
  <!-- Inbox tray front with crisp chevron-7 notch -->
  <path d="M28 96h30a8 8 0 0 1 7.16 4.42l4.18 8.36A13 13 0 0 0 80.97 116h18.06a13 13 0 0 0 11.63-7.22l4.18-8.36A8 8 0 0 1 122 96h30v28c0 14.36-11.64 26-26 26H54c-14.36 0-26-11.64-26-26V96Z" fill="url(#s7i-tray)"/>
  <!-- Subtle crisp "7" emblem centered on tray lip -->
  <path d="M81 127h18l-8.5 14.5" fill="none" stroke="#2563eb" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
